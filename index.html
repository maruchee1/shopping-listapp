<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>쇼핑 리스트</title>
<style>
  :root {
    /* color-scheme + light-dark(): 미디어 쿼리 없이 한 줄로 라이트/다크 정의,
       체크박스·입력창 등 네이티브 폼 컨트롤도 자동으로 다크 스타일 적용 (MDN 권장) */
    color-scheme: light dark;
    --bg: light-dark(#f4f5f7, #111827);
    --card: light-dark(#ffffff, #1f2937);
    --text: light-dark(#1f2937, #f9fafb);
    --muted: light-dark(#6b7280, #9ca3af);
    --border: light-dark(#e5e7eb, #374151);
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --danger: #ef4444;
    --danger-hover: #dc2626;
    --done: light-dark(#9ca3af, #6b7280);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 40px 16px;
  }
  .app {
    width: 100%;
    max-width: 480px;
    background: var(--card);
    border-radius: 16px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    padding: 28px 24px;
  }
  h1 {
    font-size: 1.5rem;
    margin-bottom: 4px;
  }
  .summary {
    color: var(--muted);
    font-size: 0.875rem;
    margin-bottom: 20px;
  }
  form {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
  }
  input[type="text"] {
    flex: 1;
    padding: 12px 14px;
    font-size: 1rem;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--bg);
    color: var(--text);
    outline: none;
  }
  input[type="text"]:focus { border-color: var(--accent); }
  button {
    cursor: pointer;
    border: none;
    border-radius: 10px;
    font-size: 0.95rem;
    font-weight: 600;
    transition: background 0.15s;
  }
  .add-btn {
    padding: 12px 18px;
    background: var(--accent);
    color: #fff;
  }
  .add-btn:hover { background: var(--accent-hover); }
  ul { list-style: none; }
  li {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 8px;
    border-bottom: 1px solid var(--border);
    animation: fadeIn 0.2s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
  li:last-child { border-bottom: none; }
  li input[type="checkbox"] {
    width: 20px;
    height: 20px;
    accent-color: var(--accent);
    cursor: pointer;
    flex-shrink: 0;
  }
  li .name {
    flex: 1;
    font-size: 1rem;
    word-break: break-word;
    cursor: pointer;
  }
  li.done .name {
    text-decoration: line-through;
    color: var(--done);
  }
  .del-btn {
    padding: 6px 10px;
    background: transparent;
    color: var(--muted);
    font-size: 1.1rem;
    line-height: 1;
  }
  .del-btn:hover { color: var(--danger); background: rgba(239,68,68,0.1); }
  .empty {
    text-align: center;
    color: var(--muted);
    padding: 32px 0;
    font-size: 0.95rem;
  }
  .footer {
    display: flex;
    justify-content: flex-end;
    margin-top: 16px;
  }
  .clear-btn {
    padding: 8px 12px;
    background: transparent;
    color: var(--muted);
    font-size: 0.85rem;
    font-weight: 500;
  }
  .clear-btn:hover { color: var(--danger); }
  .clear-btn[hidden] { display: none; }
</style>
</head>
<body>
  <main class="app">
    <h1>🛒 쇼핑 리스트</h1>
    <p class="summary" id="summary">아이템이 없습니다</p>

    <form id="add-form" autocomplete="off">
      <input type="text" id="item-input" placeholder="살 것을 입력하세요" maxlength="100" required>
      <button type="submit" class="add-btn">추가</button>
    </form>

    <ul id="list"></ul>
    <p class="empty" id="empty">아직 아이템이 없어요. 위에서 추가해 보세요!</p>

    <div class="footer">
      <button type="button" class="clear-btn" id="clear-done" hidden>체크된 항목 삭제</button>
    </div>
  </main>

<!-- Supabase JS 클라이언트 (UMD 빌드, 전역 supabase 객체 제공) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(() => {
  // Supabase 프로젝트 설정 (publishable key는 클라이언트 노출용 공개 키)
  const SUPABASE_URL = "https://kgfjrgspfcrasfsybrtp.supabase.co";
  const SUPABASE_KEY = "sb_publishable_VKj-ggDkW6NdWZrcauTxjw__4BuvHf7";
  const TABLE = "shopping_items";
  const LEGACY_STORAGE_KEY = "shopping-list-items"; // 예전 로컬 스토리지 키 (1회 마이그레이션용)

  const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const form = document.getElementById("add-form");
  const input = document.getElementById("item-input");
  const list = document.getElementById("list");
  const empty = document.getElementById("empty");
  const summary = document.getElementById("summary");
  const clearDoneBtn = document.getElementById("clear-done");

  let items = [];

  function showError(message, err) {
    console.error(message, err);
    summary.textContent = `⚠️ ${message}`;
  }

  // 예전 로컬 스토리지 데이터가 남아 있으면 DB로 옮긴 뒤 삭제
  async function migrateLegacyItems() {
    let legacy = [];
    try {
      const raw = localStorage.getItem(LEGACY_STORAGE_KEY);
      const parsed = raw ? JSON.parse(raw) : [];
      legacy = Array.isArray(parsed) ? parsed : [];
    } catch { legacy = []; }
    if (legacy.length === 0) return;

    const rows = legacy
      .filter(i => i && typeof i.name === "string" && i.name.trim())
      .map(i => ({ name: i.name.trim().slice(0, 100), done: Boolean(i.done) }));

    const { error } = rows.length ? await db.from(TABLE).insert(rows) : { error: null };
    if (error) {
      showError("기존 데이터를 옮기지 못했습니다", error);
      return;
    }
    try { localStorage.removeItem(LEGACY_STORAGE_KEY); } catch { /* 무시 */ }
  }

  async function load() {
    summary.textContent = "불러오는 중…";
    const { data, error } = await db
      .from(TABLE)
      .select("id, name, done, created_at")
      .order("created_at", { ascending: true });
    if (error) {
      showError("목록을 불러오지 못했습니다", error);
      return;
    }
    items = data ?? [];
    render();
  }

  async function addItem(name) {
    const { data, error } = await db
      .from(TABLE)
      .insert({ name })
      .select("id, name, done, created_at")
      .single();
    if (error) {
      showError("추가에 실패했습니다", error);
      return;
    }
    items.push(data);
    render();
  }

  async function toggleItem(id) {
    const item = items.find(i => i.id === id);
    if (!item) return;
    const nextDone = !item.done;
    const { error } = await db.from(TABLE).update({ done: nextDone }).eq("id", id);
    if (error) {
      showError("변경에 실패했습니다", error);
      render(); // 체크박스 상태 원복
      return;
    }
    item.done = nextDone;
    render();
  }

  async function deleteItem(id) {
    const { error } = await db.from(TABLE).delete().eq("id", id);
    if (error) {
      showError("삭제에 실패했습니다", error);
      return;
    }
    items = items.filter(i => i.id !== id);
    render();
  }

  async function clearDone() {
    const { error } = await db.from(TABLE).delete().eq("done", true);
    if (error) {
      showError("삭제에 실패했습니다", error);
      return;
    }
    items = items.filter(i => !i.done);
    render();
  }

  function render() {
    list.replaceChildren(); // innerHTML = "" 대신 표준 DOM API로 자식 노드 제거
    const hasItems = items.length > 0;
    empty.hidden = hasItems;

    const doneCount = items.filter(i => i.done).length;
    summary.textContent = hasItems
      ? `총 ${items.length}개 · 완료 ${doneCount}개 · 남은 ${items.length - doneCount}개`
      : "아이템이 없습니다";
    clearDoneBtn.hidden = doneCount === 0;

    // 체크 안 된 항목을 위로, 체크된 항목을 아래로
    const sorted = [...items].sort((a, b) => Number(a.done) - Number(b.done));

    for (const item of sorted) {
      const li = document.createElement("li");
      li.dataset.id = item.id;
      if (item.done) li.classList.add("done");

      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.checked = item.done;
      checkbox.setAttribute("aria-label", `${item.name} 완료 표시`);
      checkbox.addEventListener("change", () => toggleItem(item.id));

      const name = document.createElement("span");
      name.className = "name";
      name.textContent = item.name;
      name.addEventListener("click", () => toggleItem(item.id));

      const del = document.createElement("button");
      del.type = "button";
      del.className = "del-btn";
      del.textContent = "✕";
      del.setAttribute("aria-label", `${item.name} 삭제`);
      del.addEventListener("click", () => deleteItem(item.id));

      li.append(checkbox, name, del);
      list.appendChild(li);
    }
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const name = input.value.trim();
    if (!name) return;
    input.value = "";
    await addItem(name);
    input.focus();
  });

  clearDoneBtn.addEventListener("click", clearDone);

  (async () => {
    await migrateLegacyItems();
    await load();
    input.focus();
  })();
})();
</script>
</body>
</html>
